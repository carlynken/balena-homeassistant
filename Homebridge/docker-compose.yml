version: '2'
services:
  homebridge:
    image: homebridge/homebridge:latest
    ports: 
      - 8581:8581
    restart: always
    network_mode: host
    volumes:
      - ./volumes/homebridge:/homebridge
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
